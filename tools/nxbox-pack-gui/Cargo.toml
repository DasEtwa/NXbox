[package]
name = "nxbox-pack-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
eframe = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rfd = "0.17.2"
serde_json = "1.0.154"
sys-locale = "0.3.2"

[dev-dependencies]
egui_kittest = { version = "0.36.0", features = ["wgpu"] }

[[bin]]
name = "NxbHelper"
path = "src/main.rs"

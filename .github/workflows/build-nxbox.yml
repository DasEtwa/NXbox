name: Build NXbox for Xbox Series X
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, port/xbox-series-x, d3d12-integration]
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cpmfile.json"
      - "tools/nxbox/**"
      - ".github/workflows/build-nxbox.yml"
permissions:
  contents: read
concurrency:
  group: nxbox-uwp-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      # Local sccache directory saved as one cache archive: the GHA backend fetched each of
      # ~1700 objects with its own HTTP request, which took ~7 minutes even at 99.9% hits.
      SCCACHE_DIR: ${{ github.workspace }}\.cache\sccache
      SCCACHE_CACHE_SIZE: 4G
      NXBOX_OPENSSL_CACHE: ${{ github.workspace }}\.cache\openssl-uwp
    steps:
      - uses: actions/checkout@v4
      - name: Identify OpenSSL package and UWP toolchain
        id: openssl-key
        shell: cmd
        run: |
          set "PATH=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer;%PATH%"
          for /f "usebackq delims=" %%i in (`vswhere -latest -products * -property installationPath`) do set "NXBOX_VSROOT=%%i"
          if not defined NXBOX_VSROOT exit /b 1
          call "%NXBOX_VSROOT%\VC\Auxiliary\Build\vcvarsall.bat" x64 uwp
          if errorlevel 1 exit /b 1
          echo msvc=%VCToolsVersion%>>"%GITHUB_OUTPUT%"
          echo sdk=%WindowsSDKVersion:\=%>>"%GITHUB_OUTPUT%"
          python -c "import json, os; p = json.load(open('cpmfile.json'))['openssl']; f = open(os.environ['GITHUB_OUTPUT'], 'a'); f.write('version=' + p['version'] + '\nhash=' + p['hash'] + '\n'); f.close()"
      - name: Cache built OpenSSL for UWP
        uses: actions/cache@v4
        id: openssl-cache
        with:
          path: .cache/openssl-uwp
          key:
            uwp-openssl-v1-${{ runner.os }}-x64-MD-Release-msvc-${{ steps.openssl-key.outputs.msvc
            }}-sdk-${{ steps.openssl-key.outputs.sdk }}-${{ steps.openssl-key.outputs.version }}-${{
            steps.openssl-key.outputs.hash }}-${{ hashFiles('.patch/openssl/**',
            '.patch/openssl-cmake/**', 'CMakeLists.txt', 'CMakePresets.json',
            'tools/nxbox/build-uwp.cmd', 'cpmfile.json') }}
      - uses: actions/cache/restore@v4
        id: cpm-cache
        with:
          path: .cache/cpm
          key: uwp-cpm-${{ runner.os }}-${{ hashFiles('cpmfile.json', '**/cpmfile.json') }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache/sccache
          key: uwp-sccache-${{ github.run_id }}
          restore-keys: uwp-sccache-
      - uses: Mozilla-Actions/sccache-action@v0.0.11
      - name: Check sparse memory on Windows
        run: |
          cmake -S tests/port -B build-port-tests
          cmake --build build-port-tests --config Release --parallel 2
          ctest --test-dir build-port-tests -C Release --output-on-failure
      - name: Prepare shader compiler
        run: python tools/nxbox/prepare_host_tools.py
      - name: Configure and build
        shell: cmd
        run: tools\nxbox\build-uwp.cmd
      - name: Stage OpenSSL headers and libraries for caching
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: cmake --install build-uwp --prefix "$env:NXBOX_OPENSSL_CACHE" --component nxbox-openssl
      - uses: actions/cache/save@v4
        if: always() && steps.cpm-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}
      - name: Stop sccache before saving its directory
        if: always()
        run: sccache --stop-server
        continue-on-error: true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/sccache
          key: uwp-sccache-${{ github.run_id }}
      - name: Collect build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxbox-uwp-build
          retention-days: 7
          path: |
            build-uwp/bin/**
            build-uwp/CMakeCache.txt
            build-uwp/CMakeFiles/CMakeConfigureLog.yaml
            build-uwp/configure.log
            build-uwp/build.log
            build-uwp/frontend.log

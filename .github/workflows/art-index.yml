name: Refresh community artwork index
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: launchbox-art-index
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/port -p test_art_index.py
      - run: python tools/nxbox/build_art_index.py
      - name: Update generated distribution index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/art/backgrounds.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh LaunchBox background index'
            git push
          fi

name: Build NxbHelper
on:
  push:
    branches: [main, feat/nxhelper, chore/nxbhelper-brand]
    paths:
      - tools/nxbox-pack/**
      - tools/nxbox-pack-gui/**
      - dist/nxbox/AppxManifest.xml
      - .github/workflows/nxbhelper.yml
  pull_request:
    paths:
      - tools/nxbox-pack/**
      - tools/nxbox-pack-gui/**
      - dist/nxbox/AppxManifest.xml
      - .github/workflows/nxbhelper.yml
  workflow_dispatch:
  # The release attaches the bundles built here.
  workflow_call:
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            script: build:windows
            binary: nxbhelper-windows-x64.exe
            core: nxbhelper-core.exe
            gui: NxbHelper.exe
            bundle: NxbHelper-windows-x64
          - os: macos-15
            script: build:macos
            binary: nxbhelper-macos-arm64
            core: nxbhelper-core
            gui: NxbHelper
            bundle: NxbHelper-macos-arm64
          - os: ubuntu-24.04
            script: build:linux
            binary: nxbhelper-linux-x64
            core: nxbhelper-core
            gui: NxbHelper
            bundle: NxbHelper-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/nxbox-pack
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run ${{ matrix.script }}
      - name: Smoke test compiled binary in both languages
        shell: bash
        run: |
          NXBHELPER_LANG=en ./dist/${{ matrix.binary }} --help
          NXBHELPER_LANG=pt ./dist/${{ matrix.binary }} --help
      # The GUI talks to the core over stdin; Wine's fstat on a pipe breaks Bun, so prove it on a real host.
      - name: Smoke test the GUI API over a stdin pipe
        shell: bash
        run: |
          out=$(echo '{"cmd":"nope"}' | ./dist/${{ matrix.binary }} --api || true)
          echo "$out"
          test "$out" = '{"error":"args"}'
      - name: Record binary checksum
        env:
          NXHELPER_BINARY: ${{ matrix.binary }}
        run: |
          bun -e "const name=process.env.NXHELPER_BINARY; const path='dist/'+name; await Bun.write(path+'.sha256',new Bun.CryptoHasher('sha256').update(await Bun.file(path).arrayBuffer()).digest('hex')+'  '+name+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          if-no-files-found: error
          path: |
            tools/nxbox-pack/dist/${{ matrix.binary }}
            tools/nxbox-pack/dist/${{ matrix.binary }}.sha256
      # One Rust codebase builds the window on all three systems; the core binary sits next to it.
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - name: Build GUI and bundle it with the core
        shell: bash
        working-directory: tools/nxbox-pack-gui
        run: |
          cargo build --release --locked
          mkdir -p ../nxbox-pack/dist/bundle
          cp target/release/${{ matrix.gui }} ../nxbox-pack/dist/bundle/
          cp ../nxbox-pack/dist/${{ matrix.binary }} ../nxbox-pack/dist/bundle/${{ matrix.core }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}
          if-no-files-found: error
          path: tools/nxbox-pack/dist/bundle/

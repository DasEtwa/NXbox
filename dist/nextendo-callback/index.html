<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="referrer" content="no-referrer" />
        <title>Nextendo · NXbox</title>
        <style>
            :root {
                color-scheme: dark;
                --background: #000;
                --text: #f5f5f7;
                --secondary: #aaa;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: max(32px, env(safe-area-inset-top)) 24px;
                background: var(--background);
                color: var(--text);
                font:
                    17px/1.5 system-ui,
                    sans-serif;
            }
            main {
                max-width: 560px;
                margin: 12vh auto;
            }
            h1 {
                font-size: 34px;
                line-height: 1.15;
                letter-spacing: -0.03em;
            }
            p {
                color: var(--secondary);
            }
            a {
                display: inline-flex;
                align-items: center;
                min-height: 44px;
                padding: 10px 24px;
                border-radius: 999px;
                background: var(--text);
                color: var(--background);
            }
            [hidden] {
                display: none;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Nextendo · NXbox</h1>
            <p id="message" role="status">Returning to your Xbox… / Voltando para o Xbox…</p>
            <a id="retry" hidden></a>
        </main>
        <script>
            "use strict";
            const portuguese = /^pt\b/i.test(navigator.language || "en");
            document.documentElement.lang = portuguese ? "pt-BR" : "en";
            const text = portuguese
                ? {
                      returning:
                          "Voltando para o Xbox. Mantenha o celular e o Xbox na mesma rede Wi-Fi. Se não abrir, volte aqui e tente de novo, ou use X no Xbox para entrar pelo navegador.",
                      invalid:
                          "Este retorno de login é inválido. Inicie um novo login no Xbox e escaneie o QR code novamente.",
                      denied: "O login não foi autorizado. Volte para o Xbox e tente novamente.",
                      retry: "Tentar de novo",
                  }
                : {
                      returning:
                          "Returning to your Xbox. Keep your phone and Xbox on the same Wi-Fi. If it does not open, return here and try again, or press X on Xbox to use the browser.",
                      invalid:
                          "This sign-in callback is invalid. Start a new sign-in on Xbox and scan the QR code again.",
                      denied: "Sign-in was not authorized. Return to your Xbox and try again.",
                      retry: "Try again",
                  };
            const query = new URLSearchParams(location.search);
            const code = query.get("code");
            const state = query.get("state") || "";
            const parts = state.split("~");
            const octets = (parts[1] || "").split(".");
            const validIp =
                octets.length === 4 &&
                octets.every((part) => /^(0|[1-9][0-9]{0,2})$/.test(part) && Number(part) <= 255) &&
                (octets[0] === "10" ||
                    (octets[0] === "172" && Number(octets[1]) >= 16 && Number(octets[1]) <= 31) ||
                    (octets[0] === "192" && octets[1] === "168"));
            const valid =
                parts.length === 3 &&
                /^[A-Za-z0-9_-]{22}$/.test(parts[0]) &&
                validIp &&
                /^[1-9][0-9]{3,4}$/.test(parts[2]) &&
                Number(parts[2]) >= 1024 &&
                Number(parts[2]) <= 65535 &&
                code &&
                !/[\x00-\x1f\x7f]/.test(code) &&
                query.getAll("code").length === 1 &&
                query.getAll("state").length === 1;
            const message = document.getElementById("message");
            if (query.has("error")) {
                message.textContent = text.denied;
            } else if (!valid) {
                message.textContent = text.invalid;
            } else {
                const target =
                    "http://" +
                    parts[1] +
                    ":" +
                    parts[2] +
                    "/callback?code=" +
                    encodeURIComponent(code) +
                    "&state=" +
                    encodeURIComponent(state);
                message.textContent = text.returning;
                const retry = document.getElementById("retry");
                retry.textContent = text.retry;
                retry.href = target;
                retry.hidden = false;
                retry.addEventListener("click", (event) => {
                    event.preventDefault();
                    location.replace(target);
                });
                location.replace(target);
            }
        </script>
    </body>
</html>
